[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "king-county-house-price-prediction"
version = "1.0.0"
description = "Reproducible CatBoost model for King County house prices"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "catboost==1.2.8",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
explainability = ["shap==0.50.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
